<!doctype html>
<html lang="en-AU" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d14">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="PrepWise — an offline study planner and quiz centre for any certification.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PrepWise">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PrepWise</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" class="shell">
    <aside class="sidebar" aria-label="Navigation">
      <div class="sb-brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="url(#lg)"/><path d="M10 22V10h6.2a4.3 4.3 0 0 1 0 8.6H10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#8b6cff"/></linearGradient></defs></svg></span>
        <span class="brand-name">PrepWise</span>
        <button class="icon-btn sb-toggle" data-action="toggle-sidebar" aria-label="Collapse or expand sidebar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      </div>
      <button class="cert-chip sb-cert" id="sb-cert" data-action="cert-switcher" aria-label="Switch certification"></button>
      <nav class="sb-nav" id="sb-nav"></nav>
      <div class="sb-foot" id="sb-status"></div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="topbar-text">
            <div class="eyebrow" id="topbar-eyebrow"></div>
            <h1 id="topbar-title">Home</h1>
          </div>
          <button class="cert-chip tb-cert" id="tb-cert" data-action="cert-switcher" aria-label="Switch certification"></button>
          <button class="icon-btn tb-settings" data-nav="settings" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
        </div>
      </header>

      <main id="main" tabindex="-1">
        <section class="view" id="view-home" aria-label="Home"></section>
        <section class="view" id="view-certs" aria-label="My Certifications" hidden></section>
        <section class="view" id="view-plan" aria-label="Study plan" hidden></section>
        <section class="view" id="view-resources" aria-label="Learning resources" hidden></section>
        <section class="view" id="view-revision" aria-label="Revision and notes" hidden></section>
        <section class="view" id="view-quiz" aria-label="Quiz Centre" hidden></section>
        <section class="view" id="view-analytics" aria-label="Progress and analytics" hidden></section>
        <section class="view" id="view-settings" aria-label="Settings" hidden></section>
      </main>
    </div>

    <div id="mini-timer" class="mini-timer" hidden></div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Main"></nav>
  </div>

  <div id="sheet-root" class="sheet-root" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle" data-action="close-sheet"></div>
      <div class="sheet-body" id="sheet-body" tabindex="-1"></div>
    </div>
  </div>

  <div id="dialog-root" class="dialog-root" hidden></div>
  <div id="celebrate-root" class="celebrate-root" hidden></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="quiz-player" class="quiz-player" hidden></div>

  <noscript><p style="padding:24px;color:#fff">PrepWise needs JavaScript enabled.</p></noscript>
  <!-- Core -->
  <script src="js/schema.js"></script>
  <!-- Built-in certification profiles (content only) -->
  <script src="certifications/ab-650/meta.js"></script>
  <script src="certifications/ab-650/questions-d1.js"></script>
  <script src="certifications/ab-650/questions-d2.js"></script>
  <script src="certifications/ab-650/questions-d3.js"></script>
  <script src="certifications/ab-650/profile.js"></script>
  <!-- App shell and feature modules -->
  <script src="app.js"></script>
  <script src="js/certs.js"></script>
  <script src="quiz-centre.js"></script>
  <script src="js/revision.js"></script>
</body>
</html>
